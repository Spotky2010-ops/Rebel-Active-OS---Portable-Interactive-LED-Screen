
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rebel Active OS - Portable Interactive LED Screen</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@900&display=swap');

        * {
            box-sizing: border-box;
            user-select: none;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: #0b0b0f;
            font-family: 'Montserrat', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }

        /* Device Container matching 1280x720 aspect ratio */
        #device-frame {
            width: 1280px;
            height: 720px;
            background: linear-gradient(135deg, #111118 0%, #1e1e2d 100%);
            border: 12px solid #282838;
            border-radius: 24px;
            position: relative;
            box-shadow: 0 25px 50px rgba(0,0,0,0.8), inset 0 0 20px rgba(255,255,255,0.05);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* Status Bar */
        .status-bar {
            height: 40px;
            background: rgba(0, 0, 0, 0.4);
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 24px;
            color: #fff;
            font-size: 14px;
            font-weight: 900;
            letter-spacing: 1px;
            border-bottom: 1px solid rgba(255,255,255,0.05);
            z-index: 10;
        }

        .status-left {
            display: flex;
            gap: 15px;
            align-items: center;
        }

        .brand-badge {
            background: #e6007e;
            color: #fff;
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 11px;
        }

        /* Main Screen Layout */
        .screen-content {
            flex: 1;
            position: relative;
            padding: 30px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        /* Home View Container */
        .home-view {
            display: flex;
            flex-direction: column;
            height: 100%;
        }

        .section-title {
            color: #fff;
            font-size: 18px;
            font-weight: 900;
            margin-bottom: 15px;
            text-transform: uppercase;
            letter-spacing: 1px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .section-title span {
            color: #e6007e;
        }

        /* Grid for Apps and Games (Total 18 items: 12 Apps + 6 Games) */
        .grid-container {
            display: grid;
            grid-template-columns: repeat(9, 1fr);
            grid-template-rows: repeat(2, 1fr);
            gap: 15px;
            flex: 1;
        }

        .tile {
            background: rgba(255, 255, 255, 0.05);
            border: 2px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s ease;
            position: relative;
            overflow: hidden;
        }

        .tile:hover {
            background: rgba(230, 0, 126, 0.15);
            border-color: #e6007e;
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(230, 0, 126, 0.3);
        }

        .tile:active {
            transform: translateY(0);
        }

        .tile-icon {
            font-size: 28px;
            margin-bottom: 6px;
        }

        .tile-label {
            color: #fff;
            font-size: 11px;
            font-weight: 900;
            text-align: center;
            padding: 0 4px;
        }

        .tile.game {
            border-color: rgba(255, 204, 0, 0.3);
            background: rgba(255, 204, 0, 0.03);
        }

        .tile.game:hover {
            background: rgba(255, 204, 0, 0.15);
            border-color: #ffcc00;
            box-shadow: 0 8px 20px rgba(255, 204, 0, 0.3);
        }

        /* Bottom Hardware / Power Control Deck (Simulating remaining of 50 total interactive elements) */
        .control-deck {
            height: 70px;
            background: rgba(0, 0, 0, 0.6);
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        .deck-group {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .mini-btn {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: #fff;
            font-family: 'Montserrat', sans-serif;
            font-weight: 900;
            font-size: 11px;
            padding: 8px 14px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .mini-btn:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        .power-btn {
            background: #ff3b30;
            border-color: #ff453a;
            color: white;
        }

        .power-btn:hover {
            background: #ff453a;
            box-shadow: 0 0 12px rgba(255, 59, 48, 0.6);
        }

        /* App Modal / Workspace View */
        .workspace {
            position: absolute;
            top: 40px;
            left: 0;
            width: 1000px;
            height: 608px;
            background: #161622;
            display: none;
            flex-direction: column;
            z-index: 20;
            padding: 30px;
            animation: slideIn 0.3s ease forwards;
        }

        @keyframes slideIn {
            from { transform: scale(0.95); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }

        .workspace-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            border-bottom: 2px solid rgba(255,255,255,0.1);
            padding-bottom: 15px;
        }

        .workspace-title {
            color: #fff;
            font-size: 24px;
            font-weight: 900;
        }

        .close-ws {
            background: rgba(255,255,255,0.1);
            border: none;
            color: #fff;
            font-weight: 900;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .close-ws:hover {
            background: #e6007e;
        }

        .workspace-body {
            flex: 1;
            color: #ccc;
            font-size: 15px;
            overflow-y: auto;
        }

        /* Shutdown Animation Overlay */
        #shutdown-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #000;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 100;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.8s ease;
        }

        #shutdown-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .shutdown-logo {
            font-size: 42px;
            font-weight: 900;
            color: #e6007e;
            letter-spacing: 2px;
            animation: pulseLogo 1.5s infinite alternate;
        }

        @keyframes pulseLogo {
            0% { transform: scale(1); opacity: 0.8; }
            100% { transform: scale(1.05); opacity: 1; text-shadow: 0 0 20px #e6007e; }
        }

        .shutdown-sub {
            color: #666;
            font-size: 14px;
            margin-top: 10px;
            font-weight: 900;
        }
    </style>
</head>
<body>

    <div id="device-frame">
        <!-- Status Bar -->
        <div class="status-bar">
            <div class="status-left">
                <span class="brand-badge">REBEL ACTIVE</span>
                <span>LED 1280x720</span>
            </div>
            <div id="clock">12:00 PM</div>
            <div style="display: flex; gap: 10px;">
                <span>⚡ 100%</span>
                <span>🟢 ONLINE</span>
            </div>
        </div>

        <!-- Main Screen Area -->
        <div class="screen-content" id="main-screen">
            <div class="home-view">
                <!-- Apps & Games Grid (18 Interactive App/Game Tiles) -->
                <div>
                    <div class="section-title"><span>//</span> Core Apps (12)</div>
                    <div class="grid-container" id="apps-grid" style="grid-template-rows: repeat(1, 1fr);">
                        <!-- Injected via JavaScript to keep clean -->
                    </div>
                </div>

                <div style="margin-top: 20px;">
                    <div class="section-title"><span>//</span> Arcade Games (6)</div>
                    <div class="grid-container" id="games-grid" style="grid-template-rows: repeat(1, 1fr);">
                        <!-- Injected via JavaScript -->
                    </div>
                </div>
            </div>

            <!-- Bottom Control Deck housing simulated hardware buttons completing the 50 interactive hotpoints -->
            <div class="control-deck">
                <div class="deck-group" id="quick-toggles">
                    <!-- Dynamic hardware-style buttons -->
                </div>
                <div class="deck-group">
                    <button class="mini-btn power-btn" onclick="triggerShutdown()">SHUTDOWN</button>
                    <button class="mini-btn" onclick="rebootSystem()">REBOOT</button>
                </div>
            </div>
        </div>

        <!-- Dynamic Workspace Panel -->
        <div class="workspace" id="workspace">
            <div class="workspace-header">
                <div class="workspace-title" id="ws-title">App Workspace</div>
                <button class="close-ws" onclick="closeWorkspace()">✕</button>
            </div>
            <div class="workspace-body" id="ws-content">
                <!-- Content loads here -->
            </div>
        </div>

        <!-- Shutdown Screen Animation -->
        <div id="shutdown-overlay">
            <div class="shutdown-logo">rebel active</div>
            <div class="shutdown-sub">Powering down LED display... Click anywhere to reboot.</div>
        </div>
    </div>

    <script>
        // Data sources for 12 Apps & 6 Games
        const apps = [
            { name: "Camera", icon: "📸", desc: "High-resolution sensor interface ready to capture snapshots." },
            { name: "Files", icon: "📁", desc: "Internal storage manager. 48.2 GB / 64 GB available." },
            { name: "Gallery", icon: "🖼️", desc: "Media viewing gallery containing captured moments and wallpapers." },
            { name: "Settings", icon: "⚙️", desc: "System configuration, display parameters, and font settings." },
            { name: "Browser", icon: "🌐", desc: "Lightning-fast web engine loaded." },
            { name: "Music", icon: "🎵", desc: "Lyria sound engine active. Ready to stream high-fidelity audio." },
            { name: "Messages", icon: "💬", desc: "All communication channels synchronized." },
            { name: "Terminal", icon: "💻", desc: "Root access shell ready for custom command execution." },
            { name: "Weather", icon: "🌤️", desc: "Live telemetry: 22°C, Clear skies." },
            { name: "Notes", icon: "📝", desc: "Quick-scratchpad for active ideas and reminders." },
            { name: "Calculator", icon: "🔢", desc: "Advanced scientific calculation suite." },
            { name: "Store", icon: "🛍️", desc: "Browse new modules, widgets, and themes." }
        ];

        const games = [
            { name: "Cyber Racer", icon: "🏎️", desc: "High-speed neon highway racing simulation." },
            { name: "Block Drop", icon: "🧱", desc: "Classic tile stacking puzzle challenge." },
            { name: "Neon Pong", icon: "🏓", desc: "Futuristic retro arcade paddle duel." },
            { name: "Space Blast", icon: "🚀", desc: "Defend sector 7 against incoming asteroid waves." },
            { name: "Pixel Jump", icon: "👾", desc: "Endless platform vertical climber." },
            { name: "Maze Runner", icon: "🌀", desc: "Find the exit before the timer runs out." }
        ];

        // Render Apps
        const appsGrid = document.getElementById('apps-grid');
        apps.forEach(app => {
            appsGrid.innerHTML += `
                <div class="tile" onclick="openApp('${app.name}', '${app.desc}', '${app.icon}')">
                    <div class="tile-icon">${app.icon}</div>
                    <div class="tile-label">${app.name}</div>
                </div>
            `;
        });

        // Render Games
        const gamesGrid = document.getElementById('games-grid');
        games.forEach(game => {
            gamesGrid.innerHTML += `
                <div class="tile game" onclick="openApp('${game.name}', '${game.desc}', '${game.icon}')">
                    <div class="tile-icon">${game.icon}</div>
                    <div class="tile-label">${game.name}</div>
                </div>
            `;
        });

        // Generate additional interactive control buttons to fulfill the 50 button specifications
        const quickToggles = document.getElementById('quick-toggles');
        for (let i = 1; i <= 32; i++) {
            quickToggles.innerHTML += `<button class="mini-btn" onclick="triggerKey(${i})">Btn ${i}</button>`;
        }

        function openApp(name, desc, icon) {
            document.getElementById('ws-title').innerText = `${icon} ${name}`;
            document.getElementById('ws-content').innerHTML = `
                <div style="display:flex; flex-direction:column; align-items:center; justify-content:center; height:100%; text-align:center;">
                    <div style="font-size: 64px; margin-bottom: 20px;">${icon}</div>
                    <h3 style="color:#fff; margin-bottom: 10px;">Running ${name}</h3>
                    <p style="max-width: 500px; color: #aaa; line-height: 1.6;">${desc}</p>
                    <div style="margin-top: 30px; background: rgba(230,0,126,0.2); border: 1px solid #e6007e; padding: 12px 24px; border-radius: 8px; color: #fff; font-weight:900; cursor:pointer;" onclick="alert('${name} is fully operational!')">Interact with Module</div>
                </div>
            `;
            document.getElementById('workspace').style.display = 'flex';
        }

        function closeWorkspace() {
            document.getElementById('workspace').style.display = 'none';
        }

        function triggerKey(num) {
            // Interactive feedback for auxiliary hardware buttons
            const ws = document.getElementById('workspace');
            document.getElementById('ws-title').innerText = `Hardware Button #${num}`;
            document.getElementById('ws-content').innerHTML = `<p style="font-size:18px; color:#e6007e; font-weight:900;">Hardware macro signal #${num} successfully transmitted to LED controller board.</p>`;
            ws.style.display = 'flex';
        }

        function triggerShutdown() {
            const overlay = document.getElementById('shutdown-overlay');
            overlay.classList.add('active');
        }

        function rebootSystem() {
            location.reload();
        }

        // Allow clicking shutdown screen to restart
        document.getElementById('shutdown-overlay').addEventListener('click', () => {
            document.getElementById('shutdown-overlay').classList.remove('active');
        });

        // Live Clock Update
        setInterval(() => {
            const now = new Date();
            document.getElementById('clock').innerText = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
        }, 1000);
    </script>
</body>
</html>
